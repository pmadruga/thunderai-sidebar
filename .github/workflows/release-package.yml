name: Build tagged package
on:
  push:
    tags: ['sidebar-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate source
        run: |
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/check_repository.py
      - name: Scan source history before packaging
        run: |
          bash scripts/install-gitleaks.sh "$RUNNER_TEMP/gitleaks"
          python3 scripts/scan-secrets.py --binary "$RUNNER_TEMP/gitleaks/gitleaks"
      - name: Build clean tagged source
        run: ./build-side-panel.sh --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thunderai-side-panel-xpi
          path: |
            dist/*.xpi
            dist/*.xpi.sha256
          if-no-files-found: error
          retention-days: 14
