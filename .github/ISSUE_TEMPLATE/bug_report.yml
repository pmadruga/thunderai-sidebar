name: Fork bug report
description: Report a reproducible issue in ThunderAI Side Panel.
body:
  - type: markdown
    attributes:
      value: |
        This tracker is for the independent Side Panel fork. Use synthetic email for reproduction.
        Do not attach a Thunderbird profile, API keys, settings exports, real email content, or unredacted logs.
        For a security vulnerability, follow [docs/SECURITY.md](https://github.com/pmadruga/thunderai-sidebar/blob/main/SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Fork version and source
      description: Include the release tag or commit and whether you built the XPI yourself.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Thunderbird version and operating system
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: Provider integration
      options:
        - No provider involved
        - OpenAI-compatible API
        - Ollama
        - OpenAI API
        - Google Gemini
        - Anthropic
        - ChatGPT Web
        - Task integration
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction, expected result and actual result
      description: Use synthetic data and list the steps needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Remove email text, addresses, private endpoint details and credentials. Do not enable verbose logging on real mail to obtain a report.
      render: text
